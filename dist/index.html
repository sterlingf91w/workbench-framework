<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="workspace-token" content="__TOKEN__"><title>销售工作台</title><link rel="stylesheet" href="/style.css?v=desk20261026"></head>
<body>
<aside class="sidebar"><a class="brand" href="#home" data-view="home"><span class="mark">销</span><span>销售工作台<span class="brand-sub">本地 Excel</span></span></a><nav id="nav" aria-label="主要导航"></nav><div class="side-foot"><span class="dot"></span> 数据在本地 Excel<span>个人使用 · 国内与海外项目</span></div></aside>
<div class="shell"><header class="topbar"><div class="breadcrumb">工作台 / <span id="crumb">今天</span></div><div class="top-actions"><span id="saveStatus" class="save-status">正在读取本地文件</span><button id="refresh" class="icon-btn">刷新数据</button><a class="button small" href="/download" download="客户数据.xlsx">下载 Excel 副本</a></div></header><main id="main" aria-live="polite"><div class="loading">正在打开本地工作簿…</div></main></div>
<dialog id="editor"><form id="recordForm"><div class="dialog-head"><div><span class="eyebrow" id="editKind"></span><h2 id="editTitle">新增记录</h2></div><button type="button" id="closeEditor" class="icon-btn" aria-label="关闭表单">✕</button></div><div id="formFields" class="form-grid"></div><div class="dialog-bottom"><p id="formError" role="alert"></p><div><button type="button" id="cancelEditor" class="button">取消</button><button type="submit" class="button primary" id="saveButton">保存到本地 Excel</button></div></div></form></dialog>
<dialog id="detail"><div class="dialog-head"><h2 id="detailTitle">记录详情</h2><button id="closeDetail" class="icon-btn" aria-label="关闭详情">✕</button></div><div id="detailBody"></div><div id="detailActions" class="dialog-bottom"></div></dialog>
<dialog id="samples"><form id="sampleForm"><div class="dialog-head"><div><span class="eyebrow">样品</span><h2>增加多个样品</h2></div><button type="button" id="closeSamples" class="icon-btn" aria-label="关闭样品表单">✕</button></div><div id="sampleFields" class="form-grid"></div><div class="dialog-bottom"><p id="sampleError" role="alert"></p><div><button type="button" id="cancelSamples" class="button">取消</button><button type="submit" class="button primary" id="sampleSave">写入本地 Excel</button></div></div></form></dialog>
<dialog id="confirmDelete"><div class="dialog-head"><div><span class="eyebrow" id="confirmDeleteKind">样品</span><h2>确认删除</h2></div><button type="button" id="closeConfirmDelete" class="icon-btn" aria-label="关闭确认">✕</button></div><div class="form-grid"><p id="confirmDeleteText"></p></div><div class="dialog-bottom"><p id="confirmDeleteError" role="alert"></p><div><button type="button" id="cancelConfirmDelete" class="button">取消</button><button type="button" id="doConfirmDelete" class="button danger">确认删除</button></div></div></dialog>
<dialog id="visit"><form id="visitForm"><div class="dialog-head"><div><span class="eyebrow">拜访</span><h2>记一次拜访</h2></div><button type="button" id="closeVisit" class="icon-btn" aria-label="关闭拜访表单">✕</button></div><div id="visitFields" class="form-grid"></div><div class="dialog-bottom"><p id="visitError" role="alert"></p><div><button type="button" id="cancelVisit" class="button">取消</button><button type="submit" class="button primary" id="visitSave">写入本地 Excel</button></div></div></form></dialog>
<dialog id="transcriptUpload"><div class="dialog-head"><div><span class="eyebrow">拜访记录</span><h2 id="transcriptTitle">上传校对稿</h2></div><button type="button" id="closeTranscript" class="icon-btn" aria-label="关闭上传">✕</button></div><div class="transcript-upload-body"><p>选用你已经核对的 Word 稿。保留原稿的说话人、时间戳和段落顺序，只修改对话正文；上传后将替换这一条拜访记录的整理稿，原始转写和原文件保持不变。</p><label class="field">校对后的 Word 文件（.docx）<input id="transcriptFile" type="file" accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document"></label><div id="transcriptPreview" class="transcript-preview" aria-live="polite">选择文件后先检查，再保存。</div></div><div class="dialog-bottom"><p id="transcriptError" role="alert"></p><div><button type="button" id="cancelTranscript" class="button">取消</button><button type="button" id="saveTranscript" class="button primary" disabled>确认导入本地工作台</button></div></div></dialog>
<div id="toast" role="status"></div>
<script src="/app.js?v=desk20261026"></script>
</body></html>
